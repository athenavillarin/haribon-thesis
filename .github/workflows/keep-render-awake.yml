name: Keep Render Service Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
          
      - name: Ping Render Service
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          cd product/haribon_system/backend
          python app/scripts/keep_alive.py