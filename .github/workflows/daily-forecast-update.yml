name: Daily Forecast Update

on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  update-forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: product/haribon_system/backend/.python-version
          cache: pip
          cache-dependency-path: |
            product/haribon_system/backend/requirements.txt
            product/haribon_system/backend/requirements-updater.txt

      - name: Install Python dependencies
        run: pip install -r product/haribon_system/backend/requirements-updater.txt

      - name: Run daily forecast update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          cd product/haribon_system/backend
          python app/scripts/daily_updater.py

      - name: Commit latest forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product/haribon_system/data/processed/latest.json
          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
          else
            git commit -m "chore: update daily forecast for $(TZ=Asia/Manila date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
